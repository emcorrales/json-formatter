<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online JSON formatter and validator. Beautify, minify, and format JSON with customizable indentation. Instant formatting and copy-to-clipboard functionality.">
    <meta name="keywords" content="JSON, formatter, beautifier, validator, minify, indentation, JSON parser, online tool">
    <meta name="author" content="JSON Formatter">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Tags for Social Sharing -->
    <meta property="og:title" content="JSON Formatter - Format and Validate JSON Online">
    <meta property="og:description" content="Free online JSON formatter. Beautify and validate your JSON code with customizable indentation.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://json-formatter.app">
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="JSON Formatter - Format and Validate JSON Online">
    <meta name="twitter:description" content="Free online JSON formatter. Beautify and validate your JSON code instantly.">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://json-formatter.app">
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="application-name" content="JSON Formatter">
    
    <title>JSON Formatter - Free Online JSON Beautifier & Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JSON Formatter</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.95em;">Format, validate, and beautify JSON with ease. Customize indentation and copy formatted code instantly.</p>

        <div class="message" id="message"></div>

        <div class="controls">
            <button class="btn-primary" onclick="formatJSON()">Format JSON</button>
            <button class="btn-success" onclick="copyToClipboard()">Copy Output</button>
            <button class="btn-secondary" onclick="clearAll()">Clear All</button>
            <div class="indent-control">
                <label for="indent">Indent:</label>
                <input type="number" id="indent" min="1" max="8" value="2">
            </div>
        </div>

        <div class="content">
            <div class="section">
                <h2>Input JSON</h2>
                <textarea id="input" placeholder="Paste your JSON here..."></textarea>
            </div>
            <div class="section">
                <h2>Formatted Output</h2>
                <textarea id="output" placeholder="Formatted JSON will appear here..." readonly></textarea>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EQ59G321KL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-EQ59G321KL');
    </script>
</body>
</html>
