<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JSON Formatter</h1>

        <div class="message" id="message"></div>

        <div class="controls">
            <button class="btn-primary" onclick="formatJSON()">Format JSON</button>
            <button class="btn-success" onclick="copyToClipboard()">Copy Output</button>
            <button class="btn-secondary" onclick="clearAll()">Clear All</button>
            <div class="indent-control">
                <label for="indent">Indent:</label>
                <input type="number" id="indent" min="1" max="8" value="2">
            </div>
        </div>

        <div class="content">
            <div class="section">
                <h2>Input JSON</h2>
                <textarea id="input" placeholder="Paste your JSON here..."></textarea>
            </div>
            <div class="section">
                <h2>Formatted Output</h2>
                <textarea id="output" placeholder="Formatted JSON will appear here..." readonly></textarea>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
